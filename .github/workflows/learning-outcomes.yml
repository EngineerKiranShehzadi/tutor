name: Learning outcome foundation checks
on:
  push:
    branches:
      - feature/adaptive-learning-foundation
  pull_request:
    paths:
      - 'backend/src/services/learning-outcome*'
      - 'backend/src/services/faculty-learning-gap*'
      - 'backend/src/graphql/faculty-learning-gap.schema.ts'
      - 'backend/src/graphql/resolvers/faculty-learning-gap.resolver.ts'
      - 'frontend/src/app/(admin)/admin/faculty-gaps/**'
      - 'backend/src/graphql/learning-outcome.schema.ts'
      - 'backend/src/graphql/resolvers/learning-outcome.resolver.ts'
      - 'backend/src/db/migrations/033_learning_outcomes.sql'
      - 'backend/src/db/migrations/034_misconception_evidence.sql'
      - 'backend/src/db/migrations/035_socratic_chat_state.sql'
      - 'backend/src/db/migrations/036_approved_revision_plans.sql'
      - 'backend/src/db/migrations/037_rag_benchmark_runs.sql'
      - 'backend/src/services/rag-benchmark-report.service.ts'
      - 'backend/src/graphql/rag-benchmark.schema.ts'
      - 'backend/src/graphql/resolvers/rag-benchmark.resolver.ts'
      - 'frontend/src/app/(admin)/admin/rag-evaluation/**'
      - 'backend/src/services/revision-plan*'
      - 'backend/src/services/learning-effectiveness*'
      - 'backend/src/graphql/learning-effectiveness.schema.ts'
      - 'backend/src/graphql/resolvers/learning-effectiveness.resolver.ts'
      - 'frontend/src/components/student/MyObservedProgress.tsx'
      - 'backend/src/graphql/revision-plan.schema.ts'
      - 'backend/src/graphql/resolvers/revision-plan.resolver.ts'
      - 'frontend/src/components/admin/FacultyRevisionEditor.tsx'
      - 'frontend/src/components/student/MyFacultyRevisionPlans.tsx'
      - 'backend/src/services/misconception.service.ts'
      - 'backend/src/services/socratic-state.service.ts'
      - 'backend/src/services/tutoring-mode.service.ts'
      - 'backend/src/graphql/misconception.schema.ts'
      - 'backend/src/graphql/resolvers/misconception.resolver.ts'
      - 'frontend/src/components/admin/MisconceptionReview.tsx'
      - 'frontend/src/components/student/PersonalLearningSignals.tsx'
      - 'frontend/src/app/(admin)/admin/learning-outcomes/**'
      - 'frontend/src/app/(dashboard)/learning-outcomes/**'
      - 'frontend/src/graphql/learning-outcome.queries.ts'
      - '.github/workflows/learning-outcomes.yml'
jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Learning outcome evidence regression tests
        working-directory: backend
        run: npx ts-node --transpile-only src/scripts/test-learning-outcome-evidence.ts
      - name: Tutor mode and prompt-cache isolation tests
        working-directory: backend
        env:
          DB_PASSWORD: offline-test
          JWT_SECRET: offline-test-access-secret-at-least-32-bytes
          JWT_REFRESH_SECRET: offline-test-refresh-secret-at-least-32-bytes
        run: npx ts-node --transpile-only src/scripts/test-tutoring-modes.ts
      - name: Socratic guidance stage tests
        working-directory: backend
        env:
          DB_PASSWORD: offline-test
          JWT_SECRET: offline-test-access-secret-at-least-32-bytes
          JWT_REFRESH_SECRET: offline-test-refresh-secret-at-least-32-bytes
        run: npx ts-node --transpile-only src/scripts/test-socratic-stages.ts
      - name: Faculty gap evidence and privacy threshold tests
        working-directory: backend
        env:
          DB_PASSWORD: offline-test
          JWT_SECRET: offline-test-access-secret-at-least-32-bytes
          JWT_REFRESH_SECRET: offline-test-refresh-secret-at-least-32-bytes
        run: npx ts-node --transpile-only src/scripts/test-faculty-learning-gaps.ts
      - name: Faculty-approved revision threshold tests
        working-directory: backend
        run: npx ts-node --transpile-only src/scripts/test-revision-plan-policy.ts
      - name: Observed learning progress evidence tests
        working-directory: backend
        run: npx ts-node --transpile-only src/scripts/test-learning-effectiveness.ts
      - name: Backend TypeScript
        working-directory: backend
        run: npm run typecheck
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Frontend TypeScript
        working-directory: frontend
        run: npm run typecheck
  migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: offline-test
          POSTGRES_DB: outcomes_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d outcomes_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: offline-test
      PGDATABASE: outcomes_test
    steps:
      - uses: actions/checkout@v4
      - name: Apply disposable prerequisites and outcomes schema
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/src/db/schema.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrate.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrations/022_courses.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrations/023_practice_quizzes.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrations/033_learning_outcomes.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrations/033_learning_outcomes.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrations/034_misconception_evidence.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrations/034_misconception_evidence.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrations/035_socratic_chat_state.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrations/035_socratic_chat_state.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrations/036_approved_revision_plans.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrations/036_approved_revision_plans.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrations/037_rag_benchmark_runs.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrations/037_rag_benchmark_runs.sql
      - name: Check constraints and idempotence
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE count_tables integer;
          BEGIN
            SELECT COUNT(*) INTO count_tables FROM information_schema.tables
              WHERE table_schema='public' AND table_name IN
              ('course_learning_outcomes','lecture_learning_outcomes','practice_question_outcomes');
            IF count_tables<>3 THEN RAISE EXCEPTION 'Missing outcome tables'; END IF;
          END $$;
          SQL
      - name: Verify faculty tagging constraints and student evidence isolation
        run: psql -v ON_ERROR_STOP=1 -f backend/tests/learning-misconception.sql
      - name: Verify Socratic ownership, state constraints and cascade
        run: psql -v ON_ERROR_STOP=1 -f backend/tests/socratic-state.sql
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: Install backend dependencies for real database test
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Prepare chat trace column expected by current runtime
        run: psql -v ON_ERROR_STOP=1 -c "ALTER TABLE chat_history ADD COLUMN IF NOT EXISTS trace_id text"
      - name: Align disposable lecture schema with current archival checks
        run: psql -v ON_ERROR_STOP=1 -c "ALTER TABLE lectures ADD COLUMN IF NOT EXISTS archived_at timestamptz"
      - name: Exercise faculty-approved revision lifecycle in disposable DB
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: outcomes_test
          DB_USER: postgres
          DB_PASSWORD: offline-test
          JWT_SECRET: offline-test-access-secret-at-least-32-bytes
          JWT_REFRESH_SECRET: offline-test-refresh-secret-at-least-32-bytes
        run: npx ts-node --transpile-only src/scripts/test-revision-plan-db.ts
      - name: Exercise Socratic transactional service against disposable DB
        working-directory: backend
        env:
          NODE_ENV: test
          DB_HOST: 127.0.0.1
          DB_PORT: '5432'
          DB_NAME: outcomes_test
          DB_USER: postgres
          DB_PASSWORD: offline-test
          JWT_SECRET: offline-test-access-secret-at-least-32-bytes
          JWT_REFRESH_SECRET: offline-test-refresh-secret-at-least-32-bytes
        run: npx ts-node --transpile-only src/scripts/test-socratic-db-transaction.ts
