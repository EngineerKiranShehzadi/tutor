name: Multi-format ingestion checks

on:
  push:
    branches: [feature/multi-format-ingestion]
  pull_request:
    paths:
      - 'backend/scripts/**'
      - 'backend/src/services/document-ingestion.service.ts'
      - 'backend/src/services/dataset-version.service.ts'
      - 'backend/src/routes/dataset.routes.ts'
      - 'backend/src/controllers/dataset.controller.ts'
      - 'frontend/src/components/admin/DatasetManager.tsx'
      - '.github/workflows/multi-format-ingestion.yml'
      - 'backend/src/db/migrations/022_courses.sql'
      - 'backend/src/services/course.service.ts'
      - 'backend/src/graphql/**'
      - 'frontend/src/app/(admin)/admin/courses/**'
      - 'frontend/src/app/(dashboard)/courses/**'
      - 'frontend/src/app/(dashboard)/lectures/**'

jobs:
  document-extraction:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install document extractors
        run: python -m pip install -r backend/scripts/document_requirements.txt
      - name: Run offline format regression tests
        run: python -m unittest discover -s backend/scripts -p test_extract_document.py -v
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Test document-to-RAG mapping
        working-directory: backend
        env:
          # Safe dummy values only: this test never connects to a database.
          DB_PASSWORD: offline-test
          JWT_SECRET: offline-test-access-secret-at-least-32-bytes
          JWT_REFRESH_SECRET: offline-test-refresh-secret-at-least-32-bytes
        run: npm run test:document-ingestion
      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --ignore-scripts
      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

  courses-migration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: offline-test
          POSTGRES_DB: courses_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d courses_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: '5432'
      PGUSER: postgres
      PGPASSWORD: offline-test
      PGDATABASE: courses_test
    steps:
      - uses: actions/checkout@v4
      - name: Install PostgreSQL client if missing
        run: command -v psql || (sudo apt-get update && sudo apt-get install -y postgresql-client)
      - name: Create pre-course schema and legacy lectures
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/src/db/schema.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrate.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/scripts/test-courses-pre.sql
      - name: Apply new course migration and verify preservation
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrations/022_courses.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/scripts/test-courses-post.sql
      - name: Confirm migration idempotence and course isolation
        run: |
          psql -v ON_ERROR_STOP=1 -f backend/src/db/migrations/022_courses.sql
          psql -v ON_ERROR_STOP=1 -f backend/src/scripts/test-courses-rerun.sql
