name: Tutoring mode isolated integration checks
on:
  push:
    branches: [feature/adaptive-learning-foundation]
  pull_request:
    paths:
      - 'backend/tests/tutoring-mode-integration.test.cjs'
      - 'backend/src/services/answer-generation.service.ts'
      - 'backend/src/services/tutoring-mode.service.ts'
      - 'backend/src/services/socratic-state.service.ts'
      - '.github/workflows/tutoring-mode-integration.yml'
permissions:
  contents: read
jobs:
  isolated-generation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci --ignore-scripts
        working-directory: backend
      - name: Real generation module with offline provider / DB tripwires
        working-directory: backend
        run: node --test tests/tutoring-mode-integration.test.cjs
      - name: Check transport propagation and SSE failure semantics
        working-directory: backend
        run: node --test tests/tutoring-mode-stream.test.cjs
      - name: Typecheck backend
        working-directory: backend
        run: npm run typecheck
