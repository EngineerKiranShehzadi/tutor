name: Golden RAG benchmark checks
on:
  push:
    branches: [feature/adaptive-learning-foundation]
  pull_request:
    paths: ['backend/evaluation/**', '.github/workflows/golden-rag-evaluation.yml']
permissions:
  contents: read
jobs:
  benchmark-unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install backend dependencies for isolated benchmark import test
        working-directory: backend
        run: npm ci --ignore-scripts
      - name: Test server-side recomputation and non-persistence of question text
        working-directory: backend
        run: node --test tests/rag-benchmark-import.test.cjs
      - name: Run deterministic benchmark tests (no DB or LLM)
        working-directory: backend
        run: node --test evaluation/golden-evaluator.test.cjs
